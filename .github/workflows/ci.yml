name: Puzzle Hub CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "rebuild/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run regression and browser syntax tests
        run: npm test
      - name: TypeScript build
        run: npm run build
